<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USCSS Nostromo - Terminal</title>
    <!-- Fuente Retro de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <!-- Ruta actualizada al CSS en la carpeta assets -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="crt crt-glitch">

    <!-- Indicador de Nodos (Progreso) -->
    <div id="node-tracker">
        <div class="node active" id="node-0">00: INICIO</div>
        <div class="node" id="node-1">01: PUENTE</div>
        <div class="node" id="node-2">02: LAB</div>
        <div class="node" id="node-3">03: COMMS</div>
        <div class="node" id="node-4">04: MOTORES</div>
    </div>

    <!-- Terminal Principal -->
    <div id="terminal" class="terminal-container theme-bridge">
        <div class="header">
            <span id="location-tag">INICIANDO CONEXIÓN...</span>
            <span id="oxygen-meter">O2: 100%</span>
        </div>
        
        <!-- Área del Personaje (IA MADRE) -->
        <div class="character-area">
            <div class="avatar-madre">
                <img src="assets/img/mother_interface.gif" alt="MADRE_IA" onerror="this.style.display='none'">
            </div>
            <div class="status-indicators">
                <p style="margin: 0;">SISTEMA: <span class="blink">ACTIVO</span></p>
                <p style="margin: 0; color: #aaa;">BIO-SCAN: <span class="alerta-roja">CUARENTENA ROTA</span></p>
            </div>
        </div>
        
        <!-- NUEVO: Visor Analítico Central (Para proyectar los GIFs) -->
        <div id="main-display" class="main-display hidden">
            <div class="scanlines"></div>
            <img id="display-img" src="" alt="Visor">
        </div>
        
        <!-- Aquí se inyecta el texto de Madre como máquina de escribir -->
        <div id="screen" class="screen"></div>
        
        <!-- Botones de interacción -->
        <div id="controls" class="controls"></div>
    </div>

    <!-- Modal para leer manuales -->
    <div id="manual-modal" class="modal">
        <div class="modal-content-box">
            <h2 id="modal-title" class="glitch-text"></h2>
            <div id="modal-content"></div>
            <button class="btn-close" onclick="closeModal()">[ CERRAR DOCUMENTO ]</button>
        </div>
    </div>

    <!-- Ruta actualizada al JS en la carpeta assets -->
    <script src="assets/js/app.js"></script>
</body>
</html>
