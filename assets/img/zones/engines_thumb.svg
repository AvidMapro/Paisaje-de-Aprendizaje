<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <rect width="400" height="220" fill="#0d0000"/>
  <defs>
    <pattern id="grid4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,34,68,0.06)" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,100,0,0.3)"/>
      <stop offset="60%" stop-color="rgba(255,34,68,0.08)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>
  <rect width="400" height="220" fill="url(#grid4)"/>
  <ellipse cx="200" cy="120" rx="80" ry="80" fill="url(#coreGlow)"/>
  <!-- Núcleo central del reactor -->
  <circle cx="200" cy="120" r="40" fill="none" stroke="rgba(255,34,68,0.6)" stroke-width="2"/>
  <circle cx="200" cy="120" r="30" fill="none" stroke="rgba(255,100,0,0.5)" stroke-width="1.5"/>
  <circle cx="200" cy="120" r="18" fill="rgba(255,50,0,0.15)" stroke="rgba(255,100,0,0.7)" stroke-width="1"/>
  <circle cx="200" cy="120" r="8" fill="rgba(255,100,0,0.4)" stroke="rgba(255,150,0,0.9)" stroke-width="1"/>
  <!-- Líneas de tuberías del reactor -->
  <line x1="200" y1="80" x2="200" y2="30" stroke="rgba(255,34,68,0.4)" stroke-width="3"/>
  <line x1="200" y1="160" x2="200" y2="210" stroke="rgba(255,34,68,0.4)" stroke-width="3"/>
  <line x1="160" y1="120" x2="40" y2="120" stroke="rgba(255,34,68,0.35)" stroke-width="3"/>
  <line x1="240" y1="120" x2="360" y2="120" stroke="rgba(255,34,68,0.35)" stroke-width="3"/>
  <!-- Válvulas en las tuberías -->
  <rect x="194" y="52" width="12" height="16" rx="1" fill="rgba(255,34,68,0.2)" stroke="rgba(255,34,68,0.5)" stroke-width="1"/>
  <rect x="194" y="152" width="12" height="16" rx="1" fill="rgba(255,34,68,0.2)" stroke="rgba(255,34,68,0.5)" stroke-width="1"/>
  <rect x="72" y="114" width="16" height="12" rx="1" fill="rgba(255,34,68,0.2)" stroke="rgba(255,34,68,0.5)" stroke-width="1"/>
  <rect x="312" y="114" width="16" height="12" rx="1" fill="rgba(255,34,68,0.2)" stroke="rgba(255,34,68,0.5)" stroke-width="1"/>
  <!-- Panel terminal izquierdo -->
  <rect x="15" y="20" width="130" height="80" rx="2" fill="rgba(255,34,68,0.03)" stroke="rgba(255,34,68,0.3)" stroke-width="0.5"/>
  <text x="20" y="32" font-family="monospace" font-size="6" fill="rgba(255,34,68,0.6)" letter-spacing="1">SCRIPT ENGINE v2.1</text>
  <line x1="15" y1="35" x2="145" y2="35" stroke="rgba(255,34,68,0.2)" stroke-width="0.5"/>
  <text x="20" y="46" font-family="monospace" font-size="6" fill="rgba(255,34,68,0.5)">$ crontab -e</text>
  <text x="20" y="56" font-family="monospace" font-size="6" fill="rgba(255,100,0,0.6)">*/5 * * * * /purge.sh</text>
  <text x="20" y="66" font-family="monospace" font-size="6" fill="rgba(255,34,68,0.4)">$ tar -czvf</text>
  <text x="20" y="76" font-family="monospace" font-size="6" fill="rgba(255,34,68,0.3)">  backup.tar.gz /datos</text>
  <text x="20" y="86" font-family="monospace" font-size="6" fill="rgba(255,150,0,0.7)">COMPRESSING... 87%</text>
  <text x="20" y="96" font-family="monospace" font-size="6" fill="rgba(255,34,68,0.5)">$ kill -9 [ALIEN_PID]</text>
  <!-- Panel derecho -->
  <rect x="255" y="20" width="130" height="80" rx="2" fill="rgba(255,34,68,0.03)" stroke="rgba(255,34,68,0.3)" stroke-width="0.5"/>
  <text x="260" y="32" font-family="monospace" font-size="6" fill="rgba(255,34,68,0.6)" letter-spacing="1">NUCLEO — TEMP</text>
  <line x1="255" y1="35" x2="385" y2="35" stroke="rgba(255,34,68,0.2)" stroke-width="0.5"/>
  <rect x="260" y="42" width="110" height="8" rx="1" fill="rgba(255,34,68,0.08)" stroke="rgba(255,34,68,0.2)" stroke-width="0.5"/>
  <rect x="260" y="42" width="98" height="8" rx="1" fill="rgba(255,34,68,0.5)"/>
  <text x="260" y="63" font-family="monospace" font-size="6" fill="rgba(255,100,0,0.7)">TEMP: 847°C [CRITICO]</text>
  <text x="260" y="73" font-family="monospace" font-size="6" fill="rgba(255,34,68,0.5)">REFRIGERACION: OFF</text>
  <text x="260" y="83" font-family="monospace" font-size="6" fill="rgba(255,34,68,0.6)">AUTODESTRUCCION:</text>
  <text x="260" y="93" font-family="monospace" font-size="6" fill="rgba(255,34,68,0.9)">T-MINUS: STANDBY</text>
  <!-- Alarma de brechas en casco -->
  <rect x="15" y="170" width="370" height="35" rx="1" fill="rgba(255,34,68,0.06)" stroke="rgba(255,34,68,0.4)" stroke-width="1"/>
  <text x="30" y="183" font-family="monospace" font-size="7" fill="rgba(255,34,68,0.8)">⚠ ALERTA: BRECHA EN CASCO — PRESION DEL NUCLEO INESTABLE</text>
  <text x="30" y="197" font-family="monospace" font-size="6" fill="rgba(255,34,68,0.5)">ESPECIMEN ANIDADO EN REFRIGERACION PRIMARIA — MIGRAR A NARCISSUS</text>
  <!-- Título -->
  <text x="200" y="14" font-family="monospace" font-size="8" fill="rgba(255,34,68,0.5)" text-anchor="middle" letter-spacing="3">SALA DE MAQUINAS — SECTOR D</text>
  <!-- LED rojo pulsante -->
  <circle cx="375" cy="25" r="4" fill="rgba(255,34,68,0.9)"/>
  <circle cx="375" cy="25" r="2" fill="rgba(255,100,0,1)"/>
</svg>