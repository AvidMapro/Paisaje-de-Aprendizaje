    <circle cx='200' cy='120' r='6' fill='#ff2244' stroke='none' opacity='0.9'/>
    <!-- Gear-like spokes -->
    <line x1='200' y1='60' x2='200' y2='80' stroke-width='3' opacity='0.6'/>
    <line x1='200' y1='160' x2='200' y2='180' stroke-width='3' opacity='0.6'/>
    <line x1='140' y1='120' x2='160' y2='120' stroke-width='3' opacity='0.6'/>
    <line x1='240' y1='120' x2='260' y2='120' stroke-width='3' opacity='0.6'/>
    <line x1='157' y1='77' x2='171' y2='91' stroke-width='3' opacity='0.6'/>
    <line x1='243' y1='77' x2='229' y2='91' stroke-width='3' opacity='0.6'/>
    <line x1='157' y1='163' x2='171' y2='149' stroke-width='3' opacity='0.6'/>
    <line x1='243' y1='163' x2='229' y2='149' stroke-width='3' opacity='0.6'/>
    <!-- Warning triangle -->
    <polygon points='200,88 218,118 182,118' stroke-width='1.5' opacity='0.7'/>
    <line x1='200' y1='97' x2='200' y2='110' stroke-width='2' stroke='#ff2244'/>
    <circle cx='200' cy='114' r='2' fill='#ff2244' stroke='none'/>
  </g>
  <text x='200' y='26' text-anchor='middle' fill='#ff2244' font-family='monospace' font-size='11' letter-spacing='3' opacity='0.7'>SALA DE MÁQUINAS</text>
  <text x='200' y='228' text-anchor='middle' fill='#ff224466' font-family='monospace' font-size='9' letter-spacing='2'>SCRIPTS • BACKUPS • AUTODESTRUCCIÓN</text>
  <g stroke='#ff2244' stroke-width='1.5' fill='none' opacity='0.5'>
    <polyline points='8,8 8,24 24,24'/>
    <polyline points='392,8 392,24 376,24'/>
    <polyline points='8,232 8,216 24,216'/>
    <polyline points='392,232 392,216 376,216'/>
