    <line x1='80' y1='0' x2='80' y2='240'/>
    <line x1='160' y1='0' x2='160' y2='240'/>
    <line x1='240' y1='0' x2='240' y2='240'/>
    <line x1='320' y1='0' x2='320' y2='240'/>
  </g>
  <!-- Engine core -->
  <circle cx='200' cy='120' r='70' fill='url(#core)'/>
  <g filter='url(#glow4)' stroke='#ff2244' fill='none'>
    <circle cx='200' cy='120' r='60' stroke-width='1.5' opacity='0.4'/>
