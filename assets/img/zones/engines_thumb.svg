<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <rect width="400" height="200" fill="#0d0000"/>
  <!-- Grid -->
  <line x1="0" y1="40" x2="400" y2="40" stroke="#ff224415" stroke-width="1"/>
  <line x1="0" y1="80" x2="400" y2="80" stroke="#ff224415" stroke-width="1"/>
  <line x1="0" y1="120" x2="400" y2="120" stroke="#ff224415" stroke-width="1"/>
  <line x1="0" y1="160" x2="400" y2="160" stroke="#ff224415" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="200" stroke="#ff224415" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="200" stroke="#ff224415" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="200" stroke="#ff224415" stroke-width="1"/>
  <!-- Motor central -->
  <rect x="150" y="50" width="100" height="100" rx="8" fill="none" stroke="#ff2244" stroke-width="1.5" opacity="0.8"/>
  <!-- Núcleo del motor -->
  <rect x="170" y="70" width="60" height="60" rx="4" fill="#ff224410" stroke="#ff2244" stroke-width="1" opacity="0.7"/>
  <!-- Aspas -->
  <line x1="200" y1="70" x2="200" y2="130" stroke="#ff2244" stroke-width="1.5" opacity="0.6"/>
  <line x1="170" y1="100" x2="230" y2="100" stroke="#ff2244" stroke-width="1.5" opacity="0.6"/>
  <line x1="178" y1="78" x2="222" y2="122" stroke="#ff2244" stroke-width="1" opacity="0.4"/>
  <line x1="222" y1="78" x2="178" y2="122" stroke="#ff2244" stroke-width="1" opacity="0.4"/>
  <!-- Centro caliente -->
  <circle cx="200" cy="100" r="10" fill="#ff224430" stroke="#ff2244" stroke-width="1.5"/>
  <circle cx="200" cy="100" r="4" fill="#ff2244" opacity="0.8"/>
  <!-- Tuberías -->
  <line x1="150" y1="70" x2="80" y2="50" stroke="#ff2244" stroke-width="2" opacity="0.5"/>
  <line x1="150" y1="130" x2="80" y2="150" stroke="#ff2244" stroke-width="2" opacity="0.5"/>
  <line x1="250" y1="70" x2="320" y2="50" stroke="#ff2244" stroke-width="2" opacity="0.5"/>
  <line x1="250" y1="130" x2="320" y2="150" stroke="#ff2244" stroke-width="2" opacity="0.5"/>
  <!-- Indicador de temperatura -->
  <rect x="50" y="80" width="16" height="40" rx="2" fill="none" stroke="#ff2244" stroke-width="1" opacity="0.6"/>
  <rect x="52" y="100" width="12" height="18" rx="1" fill="#ff224440"/>
  <!-- Etiqueta -->
  <text x="200" y="175" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff224480" letter-spacing="3">ENG-04 :: BASH/PS1</text>
</svg>
