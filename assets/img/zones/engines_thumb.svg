<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240' width='400' height='240'>
  <defs>
    <radialGradient id='bg4' cx='50%' cy='60%' r='60%'>
      <stop offset='0%' stop-color='#140005'/>
      <stop offset='100%' stop-color='#080003'/>
    </radialGradient>
    <radialGradient id='core' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#ff224488'/>
      <stop offset='100%' stop-color='#ff224400'/>
    </radialGradient>
    <filter id='glow4'>
      <feGaussianBlur stdDeviation='4' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
  </defs>
  <rect width='400' height='240' fill='url(#bg4)'/>
  <g stroke='#ff224410' stroke-width='1'>
    <line x1='0' y1='40' x2='400' y2='40'/>
    <line x1='0' y1='80' x2='400' y2='80'/>
    <line x1='0' y1='120' x2='400' y2='120'/>
