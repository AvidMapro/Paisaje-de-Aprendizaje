<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <rect width="400" height="220" fill="#0a0600"/>
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,176,0,0.06)" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="acidGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="rgba(180,255,0,0.12)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>
  <rect width="400" height="220" fill="url(#grid2)"/>
  <ellipse cx="200" cy="160" rx="120" ry="60" fill="url(#acidGlow)"/>
  <!-- Mesa de laboratorio -->
  <rect x="40" y="140" width="320" height="8" rx="1" fill="rgba(255,176,0,0.15)" stroke="rgba(255,176,0,0.3)" stroke-width="0.5"/>
  <!-- Equipos de laboratorio -->
  <!-- Microscopio esquemático -->
  <line x1="80" y1="140" x2="80" y2="80" stroke="rgba(255,176,0,0.4)" stroke-width="2"/>
  <ellipse cx="80" cy="78" rx="12" ry="6" fill="none" stroke="rgba(255,176,0,0.5)" stroke-width="1"/>
  <rect x="68" y="100" width="24" height="30" rx="2" fill="rgba(255,176,0,0.08)" stroke="rgba(255,176,0,0.3)" stroke-width="0.5"/>
  <line x1="80" y1="130" x2="70" y2="140" stroke="rgba(255,176,0,0.3)" stroke-width="1"/>
  <line x1="80" y1="130" x2="90" y2="140" stroke="rgba(255,176,0,0.3)" stroke-width="1"/>
  <!-- Monitor servidor -->
  <rect x="140" y="85" width="120" height="55" rx="2" fill="none" stroke="rgba(255,176,0,0.5)" stroke-width="1"/>
  <rect x="142" y="87" width="116" height="51" fill="rgba(255,176,0,0.04)"/>
  <text x="150" y="100" font-family="monospace" font-size="7" fill="rgba(255,176,0,0.7)">$ sudo apt-get install</text>
  <text x="150" y="110" font-family="monospace" font-size="7" fill="rgba(255,176,0,0.5)">  postgresql</text>
  <text x="150" y="120" font-family="monospace" font-size="7" fill="rgba(180,255,0,0.8)">Reading package lists...</text>
  <text x="150" y="130" font-family="monospace" font-size="7" fill="rgba(180,255,0,0.6)">0% [Working]</text>
  <rect x="185" y="140" width="30" height="5" rx="1" fill="none" stroke="rgba(255,176,0,0.3)" stroke-width="0.5"/>
  <!-- Matraces con ácido -->
  <ellipse cx="310" cy="120" rx="18" ry="8" fill="rgba(180,255,0,0.15)" stroke="rgba(180,255,0,0.4)" stroke-width="1"/>
  <rect x="294" y="88" width="32" height="32" rx="0 0 10 10" fill="rgba(180,255,0,0.08)" stroke="rgba(180,255,0,0.3)" stroke-width="1"/>
  <line x1="310" y1="88" x2="310" y2="72" stroke="rgba(180,255,0,0.4)" stroke-width="1.5"/>
  <ellipse cx="310" cy="71" rx="8" ry="3" fill="none" stroke="rgba(180,255,0,0.4)" stroke-width="1"/>
  <!-- Salpicaduras de ácido en la mesa -->
  <circle cx="240" cy="145" r="3" fill="rgba(180,255,0,0.4)"/>
  <circle cx="250" cy="148" r="2" fill="rgba(180,255,0,0.3)"/>
  <circle cx="260" cy="143" r="4" fill="rgba(180,255,0,0.35)"/>
  <circle cx="270" cy="147" r="2" fill="rgba(180,255,0,0.25)"/>
  <!-- Mancha de ácido en el suelo -->
  <ellipse cx="260" cy="178" rx="40" ry="15" fill="rgba(180,255,0,0.06)" stroke="rgba(180,255,0,0.2)" stroke-width="0.5"/>
  <ellipse cx="258" cy="182" rx="25" ry="8" fill="rgba(180,255,0,0.08)"/>
  <!-- Panel de datos biológicos -->
  <rect x="30" y="160" width="150" height="48" rx="1" fill="none" stroke="rgba(255,176,0,0.25)" stroke-width="0.5"/>
  <text x="36" y="172" font-family="monospace" font-size="6" fill="rgba(255,176,0,0.5)">DATOS BIOLOGICOS — ASH</text>
  <text x="36" y="182" font-family="monospace" font-size="6" fill="rgba(255,176,0,0.35)">ESPECIMEN: XENOMORPH XX121</text>
  <text x="36" y="192" font-family="monospace" font-size="6" fill="rgba(180,255,0,0.5)">PH ACIDO: 14.7 [CRITICO]</text>
  <text x="36" y="202" font-family="monospace" font-size="6" fill="rgba(255,34,68,0.6)">CONTENCION: FALLIDA</text>
  <!-- Título -->
  <text x="200" y="14" font-family="monospace" font-size="8" fill="rgba(255,176,0,0.5)" text-anchor="middle" letter-spacing="3">LABORATORIO CIENTIFICO — SECTOR B</text>
  <!-- LED de alerta -->
  <circle cx="375" cy="25" r="4" fill="rgba(255,176,0,0.7)"/>
  <circle cx="375" cy="25" r="2" fill="rgba(255,176,0,1)"/>
</svg>