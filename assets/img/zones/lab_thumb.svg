<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240' width='400' height='240'>
  <defs>
    <radialGradient id='bg2' cx='50%' cy='50%' r='60%'>
      <stop offset='0%' stop-color='#001510'/>
      <stop offset='100%' stop-color='#000805'/>
    </radialGradient>
    <filter id='glow2'>
      <feGaussianBlur stdDeviation='3' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
  </defs>
  <rect width='400' height='240' fill='url(#bg2)'/>
  <g stroke='#00e5ff10' stroke-width='1'>
    <line x1='0' y1='40' x2='400' y2='40'/>
    <line x1='0' y1='80' x2='400' y2='80'/>
    <line x1='0' y1='120' x2='400' y2='120'/>
    <line x1='0' y1='160' x2='400' y2='160'/>
    <line x1='0' y1='200' x2='400' y2='200'/>
    <line x1='80' y1='0' x2='80' y2='240'/>
    <line x1='160' y1='0' x2='160' y2='240'/>
    <line x1='240' y1='0' x2='240' y2='240'/>
    <line x1='320' y1='0' x2='320' y2='240'/>
  </g>
  <!-- Terminal window -->
  <g filter='url(#glow2)' stroke='#00e5ff' stroke-width='1.5' fill='none'>
    <rect x='100' y='55' width='200' height='140' rx='4'/>
    <rect x='100' y='55' width='200' height='22' fill='#00e5ff20' rx='4'/>
    <circle cx='116' cy='66' r='5' fill='#ff224488'/>
    <circle cx='132' cy='66' r='5' fill='#ffb00088'/>
    <circle cx='148' cy='66' r='5' fill='#00e5ff44'/>
    <!-- Code lines -->
    <line x1='116' y1='92' x2='240' y2='92' stroke='#00e5ff60'/>
    <line x1='116' y1='108' x2='210' y2='108' stroke='#00e5ff40'/>
    <line x1='116' y1='124' x2='260' y2='124' stroke='#00e5ff60'/>
    <line x1='116' y1='140' x2='180' y2='140' stroke='#00e5ff40'/>
    <line x1='116' y1='156' x2='220' y2='156' stroke='#00e5ff60'/>
    <!-- Cursor -->
    <rect x='116' y='170' width='8' height='14' fill='#00e5ff'/>
  </g>
  <!-- $ prompt symbol -->
  <text x='116' y='185' fill='#00e5ff' font-family='monospace' font-size='13' filter='url(#glow2)'>$_</text>
  <text x='200' y='26' text-anchor='middle' fill='#00e5ff' font-family='monospace' font-size='11' letter-spacing='3' opacity='0.7'>LABORATORIO CIENTÍFICO</text>
  <text x='200' y='228' text-anchor='middle' fill='#00e5ff66' font-family='monospace' font-size='9' letter-spacing='2'>LINUX SERVER • POSTGRESQL</text>
  <g stroke='#00e5ff' stroke-width='1.5' fill='none' opacity='0.5'>
    <polyline points='8,8 8,24 24,24'/>
    <polyline points='392,8 392,24 376,24'/>
    <polyline points='8,232 8,216 24,216'/>
    <polyline points='392,232 392,216 376,216'/>
  </g>
</svg>