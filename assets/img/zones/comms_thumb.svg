<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <rect width="400" height="200" fill="#000d0e"/>
  <!-- Grid -->
  <line x1="0" y1="40" x2="400" y2="40" stroke="#00e5ff15" stroke-width="1"/>
  <line x1="0" y1="80" x2="400" y2="80" stroke="#00e5ff15" stroke-width="1"/>
  <line x1="0" y1="120" x2="400" y2="120" stroke="#00e5ff15" stroke-width="1"/>
  <line x1="0" y1="160" x2="400" y2="160" stroke="#00e5ff15" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="200" stroke="#00e5ff15" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="200" stroke="#00e5ff15" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="200" stroke="#00e5ff15" stroke-width="1"/>
  <!-- Ondas de radar -->
  <circle cx="200" cy="100" r="20" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.8"/>
  <circle cx="200" cy="100" r="45" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="100" r="70" fill="none" stroke="#00e5ff" stroke-width="0.8" opacity="0.3"/>
  <circle cx="200" cy="100" r="95" fill="none" stroke="#00e5ff" stroke-width="0.6" opacity="0.15"/>
  <!-- Punto central -->
  <circle cx="200" cy="100" r="5" fill="#00e5ff" opacity="0.9"/>
  <!-- Línea de barrido radar -->
  <line x1="200" y1="100" x2="270" y2="40" stroke="#00e5ff" stroke-width="1.5" opacity="0.7"/>
  <!-- Puntos de eco -->
  <circle cx="240" cy="65" r="4" fill="#00e5ff" opacity="0.8"/>
  <circle cx="155" cy="75" r="3" fill="#00e5ff" opacity="0.5"/>
  <circle cx="230" cy="130" r="2" fill="#00e5ff" opacity="0.4"/>
  <!-- Antena -->
  <line x1="200" y1="100" x2="200" y2="10" stroke="#00e5ff" stroke-width="1.5" opacity="0.6"/>
  <line x1="200" y1="10" x2="180" y2="20" stroke="#00e5ff" stroke-width="1" opacity="0.5"/>
  <line x1="200" y1="10" x2="220" y2="20" stroke="#00e5ff" stroke-width="1" opacity="0.5"/>
  <!-- Etiqueta -->
  <text x="200" y="175" text-anchor="middle" font-family="monospace" font-size="11" fill="#00e5ff80" letter-spacing="3">COMMS-03 :: FIREWALL</text>
</svg>
