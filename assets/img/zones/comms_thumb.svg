<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240' width='400' height='240'>
  <defs>
    <radialGradient id='bg3' cx='50%' cy='50%' r='60%'>
      <stop offset='0%' stop-color='#100a00'/>
      <stop offset='100%' stop-color='#080500'/>
    </radialGradient>
    <filter id='glow3'>
      <feGaussianBlur stdDeviation='3' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
  </defs>
  <rect width='400' height='240' fill='url(#bg3)'/>
  <g stroke='#ffb00010' stroke-width='1'>
    <line x1='0' y1='40' x2='400' y2='40'/>
    <line x1='0' y1='80' x2='400' y2='80'/>
    <line x1='0' y1='120' x2='400' y2='120'/>
    <line x1='0' y1='160' x2='400' y2='160'/>
    <line x1='0' y1='200' x2='400' y2='200'/>
    <line x1='80' y1='0' x2='80' y2='240'/>
    <line x1='160' y1='0' x2='160' y2='240'/>
    <line x1='240' y1='0' x2='240' y2='240'/>
    <line x1='320' y1='0' x2='320' y2='240'/>
  </g>
  <!-- Radar circles -->
  <g filter='url(#glow3)' stroke='#ffb000' fill='none'>
    <circle cx='200' cy='120' r='80' stroke-width='1' opacity='0.3'/>
    <circle cx='200' cy='120' r='55' stroke-width='1' opacity='0.4'/>
    <circle cx='200' cy='120' r='30' stroke-width='1' opacity='0.5'/>
    <circle cx='200' cy='120' r='8' stroke-width='1.5' opacity='0.8'/>
    <!-- Crosshairs -->
    <line x1='200' y1='40' x2='200' y2='200' stroke-width='0.8' opacity='0.3'/>
    <line x1='120' y1='120' x2='280' y2='120' stroke-width='0.8' opacity='0.3'/>
    <!-- Sweep line -->
    <line x1='200' y1='120' x2='270' y2='55' stroke-width='1.5' opacity='0.7'/>
    <!-- Blip -->
    <circle cx='255' cy='75' r='4' fill='#ffb000' opacity='0.9'/>
    <circle cx='160' cy='105' r='3' fill='#ffb000' opacity='0.6'/>
  </g>
  <!-- Port labels -->
  <text x='200' y='26' text-anchor='middle' fill='#ffb000' font-family='monospace' font-size='11' letter-spacing='3' opacity='0.7'>SALA DE COMUNICACIONES</text>
  <text x='200' y='228' text-anchor='middle' fill='#ffb00066' font-family='monospace' font-size='9' letter-spacing='2'>FIREWALL • TCP 443 • TCP 22/3389</text>
  <g stroke='#ffb000' stroke-width='1.5' fill='none' opacity='0.5'>
    <polyline points='8,8 8,24 24,24'/>
    <polyline points='392,8 392,24 376,24'/>
    <polyline points='8,232 8,216 24,216'/>
    <polyline points='392,232 392,216 376,216'/>
  </g>
</svg>