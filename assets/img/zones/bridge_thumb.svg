<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <rect width="400" height="200" fill="#000d00"/>
  <!-- Grid de fondo -->
  <line x1="0" y1="40" x2="400" y2="40" stroke="#00ff4115" stroke-width="1"/>
  <line x1="0" y1="80" x2="400" y2="80" stroke="#00ff4115" stroke-width="1"/>
  <line x1="0" y1="120" x2="400" y2="120" stroke="#00ff4115" stroke-width="1"/>
  <line x1="0" y1="160" x2="400" y2="160" stroke="#00ff4115" stroke-width="1"/>
  <line x1="80" y1="0" x2="80" y2="200" stroke="#00ff4115" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="200" stroke="#00ff4115" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="200" stroke="#00ff4115" stroke-width="1"/>
  <line x1="320" y1="0" x2="320" y2="200" stroke="#00ff4115" stroke-width="1"/>
  <!-- Consola central -->
  <rect x="120" y="60" width="160" height="90" rx="4" fill="none" stroke="#00ff41" stroke-width="1.5" opacity="0.7"/>
  <rect x="130" y="70" width="140" height="50" rx="2" fill="#00ff4108" stroke="#00ff4130" stroke-width="1"/>
  <!-- Líneas de texto simuladas -->
  <line x1="140" y1="80" x2="240" y2="80" stroke="#00ff4155" stroke-width="1.5"/>
  <line x1="140" y1="90" x2="210" y2="90" stroke="#00ff4140" stroke-width="1.5"/>
  <line x1="140" y1="100" x2="230" y2="100" stroke="#00ff4140" stroke-width="1.5"/>
  <line x1="140" y1="110" x2="190" y2="110" stroke="#00ff4140" stroke-width="1.5"/>
  <!-- Botones inferiores consola -->
  <rect x="135" y="128" width="20" height="12" rx="1" fill="#00ff4120" stroke="#00ff41" stroke-width="1"/>
  <rect x="165" y="128" width="20" height="12" rx="1" fill="#00ff4120" stroke="#00ff41" stroke-width="1"/>
  <rect x="195" y="128" width="20" height="12" rx="1" fill="#00ff4120" stroke="#00ff41" stroke-width="1"/>
  <rect x="225" y="128" width="20" height="12" rx="1" fill="#00ff4120" stroke="#00ff41" stroke-width="1"/>
  <!-- Cruz de mira -->
  <circle cx="200" cy="30" r="14" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.5"/>
  <line x1="200" y1="16" x2="200" y2="44" stroke="#00ff41" stroke-width="1" opacity="0.5"/>
  <line x1="186" y1="30" x2="214" y2="30" stroke="#00ff41" stroke-width="1" opacity="0.5"/>
  <!-- Etiqueta -->
  <text x="200" y="175" text-anchor="middle" font-family="monospace" font-size="11" fill="#00ff4180" letter-spacing="3">BRIDGE-01 :: AD DS</text>
</svg>
