<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 240' width='400' height='240'>
  <defs>
    <radialGradient id='bg' cx='50%' cy='50%' r='60%'>
      <stop offset='0%' stop-color='#001a10'/>
      <stop offset='100%' stop-color='#000a05'/>
    </radialGradient>
    <filter id='glow'>
      <feGaussianBlur stdDeviation='3' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
  </defs>
  <rect width='400' height='240' fill='url(#bg)'/>
  <!-- Grid lines -->
  <g stroke='#00ff4115' stroke-width='1'>
    <line x1='0' y1='40' x2='400' y2='40'/>
    <line x1='0' y1='80' x2='400' y2='80'/>
    <line x1='0' y1='120' x2='400' y2='120'/>
    <line x1='0' y1='160' x2='400' y2='160'/>
    <line x1='0' y1='200' x2='400' y2='200'/>
    <line x1='80' y1='0' x2='80' y2='240'/>
    <line x1='160' y1='0' x2='160' y2='240'/>
    <line x1='240' y1='0' x2='240' y2='240'/>
    <line x1='320' y1='0' x2='320' y2='240'/>
  </g>
  <!-- Server rack -->
  <g filter='url(#glow)' fill='none' stroke='#00ff41' stroke-width='1.5'>
    <rect x='140' y='60' width='120' height='120' rx='4'/>
    <rect x='150' y='70' width='100' height='16' rx='2' fill='#00ff4118'/>
    <rect x='150' y='92' width='100' height='16' rx='2' fill='#00ff4118'/>
    <rect x='150' y='114' width='100' height='16' rx='2' fill='#00ff4118'/>
    <rect x='150' y='136' width='100' height='16' rx='2' fill='#00ff4118'/>
    <circle cx='236' cy='78' r='4' fill='#00ff41'/>
    <circle cx='236' cy='100' r='4' fill='#ffb000'/>
    <circle cx='236' cy='122' r='4' fill='#00ff41'/>
    <circle cx='236' cy='144' r='4' fill='#00ff41'/>
  </g>
  <!-- Windows logo symbol -->
  <g fill='#00ff4144' transform='translate(175,168)'>
    <rect x='0' y='0' width='18' height='18' rx='2'/>
    <rect x='22' y='0' width='18' height='18' rx='2'/>
    <rect x='0' y='22' width='18' height='18' rx='2'/>
    <rect x='22' y='22' width='18' height='18' rx='2'/>
  </g>
  <!-- Label -->
  <text x='200' y='26' text-anchor='middle' fill='#00ff41' font-family='monospace' font-size='11' letter-spacing='3' opacity='0.7'>PUENTE DE MANDO</text>
  <text x='200' y='228' text-anchor='middle' fill='#00ff4166' font-family='monospace' font-size='9' letter-spacing='2'>WINDOWS SERVER • AD DS</text>
  <!-- Corner decorations -->
  <g stroke='#00ff41' stroke-width='1.5' fill='none' opacity='0.5'>
    <polyline points='8,8 8,24 24,24'/>
    <polyline points='392,8 392,24 376,24'/>
    <polyline points='8,232 8,216 24,216'/>
    <polyline points='392,232 392,216 376,216'/>
  </g>
</svg>